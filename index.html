<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Fotos Panachi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#EEF3EE; --surface:#FFFFFF; --ink:#1B2A25; --muted:#5B6B65;
  --forest:#2D5B4E; --sun:#F2B544; --sun-ink:#3A2A00; --line:#C9D6CE; --err:#B3261E;
  --wa:#128C4A; --wa-soft:#E4F5EA;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121B18; --surface:#1B2823; --ink:#EAF1EC; --muted:#9DB0A7;
    --forest:#7CC3AE; --sun:#F2B544; --sun-ink:#2A1E00; --line:#3A4D46; --err:#FF8A80;
    --wa:#25D366; --wa-soft:#17352A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121B18; --surface:#1B2823; --ink:#EAF1EC; --muted:#9DB0A7;
  --forest:#7CC3AE; --sun:#F2B544; --sun-ink:#2A1E00; --line:#3A4D46; --err:#FF8A80;
  --wa:#25D366; --wa-soft:#17352A;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.5}
main{max-width:980px;margin:0 auto;padding:44px 20px 64px}
h1{font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:clamp(2.2rem,7vw,3.6rem);line-height:1.05;margin:0 0 12px}
.lead{max-width:48ch;color:var(--muted);font-size:1.08rem;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:38px 22px;margin-top:40px}
.folder{position:relative;margin-top:24px}
.folder::before{content:"";position:absolute;top:-24px;left:0;width:44%;height:28px;background:var(--forest);border-radius:12px 12px 0 0}
.folder.group::before{background:var(--sun)}
.card{background:var(--surface);border:2px solid var(--forest);border-radius:0 16px 16px 16px;padding:26px 22px 22px;display:flex;flex-direction:column;gap:16px;min-height:200px}
.group .card{border-color:var(--sun)}
.group{grid-column:1/-1}
.card h2{font-family:'Young Serif',Georgia,serif;font-weight:400;font-size:1.45rem;line-height:1.2;margin:0}
.card p{margin:4px 0 0;color:var(--muted);font-size:.94rem}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto}
input{flex:1 1 130px;min-width:0;padding:11px 15px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible{outline:3px solid var(--forest);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--forest);color:var(--surface);font:inherit;font-weight:700;text-decoration:none;border:0;cursor:pointer}
.group .btn{background:var(--sun);color:var(--sun-ink)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn[aria-disabled="true"]{background:transparent;color:var(--muted);border:1.5px dashed var(--line);pointer-events:none}
.wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--wa-soft);color:var(--wa);font:inherit;font-weight:700;font-size:.9rem;text-decoration:none;border:1.5px solid currentColor}
.wa:hover{filter:brightness(1.05)}
.wa:focus-visible{outline:3px solid var(--wa);outline-offset:3px}
.wa svg{width:17px;height:17px;fill:currentColor;flex:none}
.msg{min-height:1.3em;margin:0;font-size:.9rem;color:var(--err)}
.hint{font-size:.85rem;color:var(--muted);margin:0}
.hint a{color:var(--wa);font-weight:700}
footer{margin-top:56px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem;max-width:60ch}
footer p{margin:0 0 8px}
</style>
</head>
<body>
<main>
  <h1>Fotos Panachi</h1>
  <p class="lead">Elige tu carpeta. Si necesita clave, escríbeme por WhatsApp y te la envío en el momento.</p>
  <section class="grid" id="grid" aria-label="Carpetas de fotos"></section>
  <footer>
    <p>Para bajar todo de una vez: abre la carpeta y elige <strong>Descargar todo</strong> en la parte superior de Drive.</p>
    <p>¿Necesitas ayuda? Escríbeme al <a href="https://wa.me/573186596536" style="color:var(--wa);font-weight:700">318&nbsp;659&nbsp;6536</a>.</p>
  </footer>
</main>
<script>
// ── Configuración ────────────────────────────────────────────────────────────
// "url": link directo de Drive (carpeta abierta, sin clave).
// "s","i","d": link cifrado con AES-GCM. Se generan con `node cifrar.mjs <url> <clave>`.
// Sin "d": la tarjeta queda marcada como pendiente.
var WHATSAPP = "573186596536"; // tu número con código de país

var CARPETAS = [
  { nombre: "Grupal", nota: "Fotos de todos juntos", url: "https://drive.google.com/drive/folders/1YFg5akBwNYMdjjU8HLXeS18ounUUssyX?usp=sharing", grupal: true },
  { nombre: "Mariana, Samuel y Kevin", s: "", i: "", d: "" },
  { nombre: "Doña Adriana y Don Nelson", s: "", i: "", d: "" },
  { nombre: "Carolina y Alejo", s: "", i: "", d: "" },
  { nombre: "Carla", s: "", i: "", d: "" },
  { nombre: "Majo", s: "", i: "", d: "" }
];
// ─────────────────────────────────────────────────────────────────────────────

function b64(t){return Uint8Array.from(atob(t),function(c){return c.charCodeAt(0)})}
async function descifrar(c, clave){
  var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(clave.trim().toLowerCase()), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(c.s), iterations:150000, hash:"SHA-256"}, km, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  var pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(c.i)}, key, b64(c.d));
  return new TextDecoder().decode(pt);
}
function waIcon(){
  return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2Zm0 18.15h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.19 8.19 0 0 1-1.26-4.38c0-4.54 3.7-8.23 8.25-8.23a8.2 8.2 0 0 1 8.24 8.24c0 4.54-3.7 8.23-8.24 8.23Zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13-.16.24-.64.8-.78.97-.15.16-.29.18-.53.06-.25-.12-1.05-.39-1.99-1.23-.74-.66-1.23-1.47-1.38-1.71-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.13-.15.17-.25.25-.41.09-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.41-.42-.56-.43h-.48c-.16 0-.43.06-.65.31-.22.25-.86.84-.86 2.05s.88 2.38 1 2.54c.13.17 1.74 2.65 4.2 3.72.59.25 1.05.4 1.4.52.59.18 1.13.16 1.55.1.48-.07 1.47-.6 1.68-1.18.21-.58.21-1.07.15-1.18-.06-.11-.22-.17-.47-.29Z"/></svg>';
}
function waLink(nombre){
  var a = document.createElement("a");
  a.className = "wa"; a.target = "_blank"; a.rel = "noopener";
  a.href = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent("Hola, quiero la clave de las fotos de " + nombre + " por favor 🙂");
  a.innerHTML = waIcon() + "Pedir la clave";
  return a;
}
function enlace(url){
  var a = document.createElement("a");
  a.className = "btn"; a.target = "_blank"; a.rel = "noopener";
  a.href = url; a.textContent = "Abrir carpeta";
  return a;
}
var grid = document.getElementById("grid");
CARPETAS.forEach(function(c){
  var f = document.createElement("div");
  f.className = "folder" + (c.grupal ? " group" : "");
  var card = document.createElement("div"); card.className = "card";
  var head = document.createElement("div");
  var h = document.createElement("h2"); h.textContent = c.nombre; head.appendChild(h);
  if (c.nota){ var p = document.createElement("p"); p.textContent = c.nota; head.appendChild(p); }
  card.appendChild(head);
  var row = document.createElement("div"); row.className = "row";

  if (c.url){
    row.appendChild(enlace(c.url));
    card.appendChild(row);
  } else if (c.d){
    var inp = document.createElement("input");
    inp.type = "password"; inp.placeholder = "Clave"; inp.autocomplete = "off"; inp.setAttribute("aria-label","Clave de " + c.nombre);
    var b = document.createElement("button"); b.className = "btn"; b.type = "button"; b.textContent = "Ingresar";
    var m = document.createElement("p"); m.className = "msg"; m.setAttribute("role","alert");
    async function probar(){
      m.textContent = "";
      if (!inp.value) { m.textContent = "Escribe la clave."; return; }
      b.textContent = "Verificando…";
      try {
        var url = await descifrar(c, inp.value);
        row.innerHTML = ""; row.appendChild(enlace(url));
        m.textContent = "";
      } catch (e) {
        m.textContent = "Clave incorrecta. Inténtalo de nuevo.";
        b.textContent = "Ingresar";
      }
    }
    b.addEventListener("click", probar);
    inp.addEventListener("keydown", function(e){ if (e.key === "Enter") probar(); });
    row.appendChild(inp); row.appendChild(b);
    card.appendChild(row);
    card.appendChild(m);
    var hint = document.createElement("p"); hint.className = "hint";
    hint.innerHTML = '¿No tienes la clave? ';
    hint.appendChild(waLink(c.nombre));
    card.appendChild(hint);
  } else {
    var pend = document.createElement("a"); pend.className = "btn"; pend.setAttribute("aria-disabled","true"); pend.textContent = "Carpeta pendiente";
    row.appendChild(pend);
    card.appendChild(row);
    var hint2 = document.createElement("p"); hint2.className = "hint";
    hint2.textContent = "Mientras tanto, escríbeme y te comparto las fotos por WhatsApp. ";
    hint2.appendChild(waLink(c.nombre));
    card.appendChild(hint2);
  }
  f.appendChild(card);
  grid.appendChild(f);
});
</script>
</body>
</html>
